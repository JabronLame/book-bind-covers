      --line-strong:  rgba(237, 230, 214, 0.22);

  .font-display { font-family: 'Fraunces', Georgia, serif; }

<div id="root"></div>

<script type="text/babel" data-presets="react-classic">
const { useState } = React;
const MM_PER_IN = 25.4;

const DEFAULTS_MM = {
  pageWidth: 150,
  pageHeight: 230,
  blockThickness: 20,
  boardThickness: 2.5,
  coverMargin: 3,
  fabricMargin: 20,
};

const round = (n, d) => Math.round(n * 10 ** d) / 10 ** d;

// ---------- Inputs ----------
function InputField({ id, label, value, unit, colorVar, onChange }) {
  const step = unit === 'mm' ? 0.5 : 0.05;
  return (
    <label htmlFor={id} className="flex items-center gap-3">
      <span className="swatch" style={{ background: `var(${colorVar})` }} />
      <span className="flex-1 text-[13.5px]" style={{ color: 'var(--ink-soft)' }}>{label}</span>
      <span className="field w-[118px]">
        <input
          id={id} name={id} type="number" inputMode="decimal" step={step} min="0"
          value={Number.isFinite(value) ? value : ''}
          onChange={(e) => onChange(id, e.target.value)}
        />
        <span className="unit">{unit}</span>
      </span>
    </label>
  );
}

// ---------- Dimension helper ----------
function Dim({ x1, y1, x2, y2, label, lx, ly, rotate, cls, fs, dyLabel, plain, marker = 'ar' }) {
  const m = plain ? undefined : `url(#${marker})`;
  return (
    <g className={cls}>
      <line className="dl" x1={x1} y1={y1} x2={x2} y2={y2} markerStart={m} markerEnd={m} />
      {label != null && (
        <text
          className="dlabel" x={lx} y={ly} dy={dyLabel || 0} style={{ fontSize: fs }}
          transform={rotate ? `rotate(${rotate} ${lx} ${ly})` : undefined}
        >
          {label}
        </text>
      )}
    </g>
  );
}

// ---------- Flat layout (live) ----------
function FlatLayoutSVG({ d }) {
  if (!(d.fabricW > 0 && d.fabricH > 0)) return null;
  const fs = Math.max(9, d.fabricW / 34);
  const cut = Math.max(0, 2 * d.fabricMargin - d.boardT * Math.SQRT2);

  const leftBoardX = d.fabricMargin;
  const spineX = d.fabricMargin + d.boardW + d.gutter;
  const rightBoardX = spineX + d.spineW + d.gutter;
  const pageLeftX = d.fabricMargin + d.coverMargin;
  const pageTopY = d.fabricMargin + d.coverMargin;
  const pageDrawW = Math.max(0, d.pageW - d.blockT / 2);

  const padX = d.fabricW * 0.14, padTop = d.fabricH * 0.12, padBot = d.fabricH * 0.2;
  const vb = `${-padX} ${-padTop} ${d.fabricW + padX * 2} ${d.fabricH + padTop + padBot}`;

  return (
    <svg viewBox={vb} className="w-full h-full" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 1 L9 5 L0 9" fill="none" stroke="context-stroke" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
        </marker>
        <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="7" stroke="var(--c-spine)" strokeWidth="1.1" opacity="0.5" />
        </pattern>
      </defs>

      {/* Fabric outline with 45° corner cuts */}
      <path
        d={`M ${cut} 0 L ${d.fabricW - cut} 0 L ${d.fabricW} ${cut} L ${d.fabricW} ${d.fabricH - cut} L ${d.fabricW - cut} ${d.fabricH} L ${cut} ${d.fabricH} L 0 ${d.fabricH - cut} L 0 ${cut} Z`}
        fill="var(--c-fabric)" fillOpacity="0.10"
        stroke="var(--c-fabric)" strokeWidth="1.8" vectorEffect="non-scaling-stroke"
        strokeDasharray="7 4"
      />

      {/* Spine fill + outline */}
      <rect x={spineX} y={d.fabricMargin} width={d.spineW} height={d.boardH} fill="url(#hatch)" />
      <rect x={spineX} y={d.fabricMargin} width={d.spineW} height={d.boardH}
        fill="none" stroke="var(--c-spine)" strokeWidth="1.8" vectorEffect="non-scaling-stroke" rx="1.5" />

      {/* Cover boards */}
      {[leftBoardX, rightBoardX].map((x, i) => (
        <rect key={i} x={x} y={d.fabricMargin} width={d.boardW} height={d.boardH}
          fill="var(--c-board)" fillOpacity="0.12"
          stroke="var(--c-board)" strokeWidth="2" vectorEffect="non-scaling-stroke" rx="2.5" />
      ))}

      {/* Page blocks */}
      {[pageLeftX, rightBoardX].map((x, i) => (
        <rect key={i} x={x} y={pageTopY} width={pageDrawW} height={d.pageH}
          fill="var(--c-page)" fillOpacity="0.14"
          stroke="var(--c-page)" strokeWidth="1.2" vectorEffect="non-scaling-stroke"
          strokeDasharray="3 3" rx="1" />
      ))}

      {/* --- Dimensions --- */}
      {/* Page height + width (on right block) */}
      <Dim cls="dim-page" fs={fs}
        x1={pageLeftX + d.pageW / 2} y1={pageTopY} x2={pageLeftX + d.pageW / 2} y2={pageTopY + d.pageH}
        label="h" lx={pageLeftX + d.pageW / 2 + fs * 0.9} ly={pageTopY + d.pageH / 2}
        rotate={-90} />
      <Dim cls="dim-page" fs={fs}
        x1={rightBoardX} y1={pageTopY + d.pageH / 2} x2={rightBoardX + pageDrawW} y2={pageTopY + d.pageH / 2}
        label="w" lx={rightBoardX + pageDrawW / 2} ly={pageTopY + d.pageH / 2 - fs * 0.7} />

      {/* Cover board width (top of left board) */}
      <Dim cls="dim-board" fs={fs}
        x1={leftBoardX} y1={-padTop * 0.42} x2={leftBoardX + d.boardW} y2={-padTop * 0.42}
        label={`board  ${fmt(d.boardW, d.unit)}`} lx={leftBoardX + d.boardW / 2} ly={-padTop * 0.42} dyLabel={-fs * 0.6} />

      {/* Spine width */}
      <Dim cls="dim-spine" fs={fs}
        x1={spineX} y1={d.fabricMargin + d.boardH / 2} x2={spineX + d.spineW} y2={d.fabricMargin + d.boardH / 2}
        label="s" lx={spineX + d.spineW / 2} ly={d.fabricMargin + d.boardH / 2 - fs * 0.7} />

      {/* Gutter (both sides) */}
      {[d.fabricMargin + d.boardW, spineX + d.spineW].map((gx, i) => (
        <Dim key={i} cls="dim-spine" fs={fs * 0.9}
          x1={gx} y1={d.fabricMargin + d.boardH + padBot * 0.2} x2={gx + d.gutter} y2={d.fabricMargin + d.boardH + padBot * 0.2}
          label="g" lx={gx + d.gutter / 2} ly={d.fabricMargin + d.boardH + padBot * 0.2} dyLabel={fs * 1.15} />
      ))}

      {/* Cover margin (square) */}
      <Dim cls="dim-fabric" fs={fs * 0.86} plain
        x1={leftBoardX - padX * 0.28} y1={d.fabricMargin} x2={leftBoardX - padX * 0.28} y2={pageTopY}
        label="sq" lx={leftBoardX - padX * 0.28 - fs * 0.9} ly={d.fabricMargin + d.coverMargin / 2} />

      {/* Fabric total width (bottom) */}
      <Dim cls="dim-fabric" fs={fs}
        x1={0} y1={d.fabricH + padBot * 0.62} x2={d.fabricW} y2={d.fabricH + padBot * 0.62}
        label={`fabric  ${fmt(d.fabricW, d.unit)} × ${fmt(d.fabricH, d.unit)}`}
        lx={d.fabricW / 2} ly={d.fabricH + padBot * 0.62} dyLabel={fs * 1.25} />
    </svg>
  );
}

// ---------- Cross-section detail (live, spine region) ----------
function CrossSectionSVG({ d }) {
  if (!(d.spineW > 0)) return null;
  const t = d.boardT, blk = d.blockT, g = d.gutter, sq = d.coverMargin;
  const spineStripX = 0;                 // outer face of case spine
  const jointX = t + g;                  // spine-side edge of cover boards
  const shown = Math.max(60, d.pageW * 0.42);
  const breakX = jointX + shown;         // fore-edge side is broken away
  const half = blk / 2;
  const fs = Math.max(7, (breakX + 40) / 30);
  const gap = t * 0.5 + 0.6;             // fabric offset outside boards

  const topBoardY = -half - t, botBoardY = half;
  const spineTop = -half - t, spineH = blk + 2 * t;

  const vb = `${-46} ${spineTop - 34} ${breakX + 78} ${spineH + 68}`;
  const jag = (y) => {
    // little torn-edge zigzag at breakX
    const a = 3.2;
    let p = `M ${breakX} ${y - blk / 2}`;
    const steps = 6, dy = blk / steps;
    for (let i = 1; i <= steps; i++) {
      p += ` L ${breakX + (i % 2 ? a : -a)} ${y - blk / 2 + dy * i}`;
    }
    return p;
  };

  return (
    <svg viewBox={vb} className="w-full h-full" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ar2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 1 L9 5 L0 9" fill="none" stroke="context-stroke" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
        </marker>
        <pattern id="hatch2" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="6" stroke="var(--c-spine)" strokeWidth="1" opacity="0.5" />
        </pattern>
      </defs>

      {/* Bookcloth wrap (fabric) — hugs the spine + turns onto outer board faces */}
      <path
        d={`M ${breakX} ${topBoardY - gap}
            L ${jointX - 1} ${topBoardY - gap}
            Q ${spineStripX - gap - 3} ${topBoardY - gap} ${spineStripX - gap - 3} ${topBoardY + 4}
            L ${spineStripX - gap - 3} ${botBoardY + t - 4}
            Q ${spineStripX - gap - 3} ${botBoardY + t + gap} ${jointX - 1} ${botBoardY + t + gap}
            L ${breakX} ${botBoardY + t + gap}`}
        fill="none" stroke="var(--c-fabric)" strokeWidth="3" vectorEffect="non-scaling-stroke"
        strokeLinejoin="round" strokeLinecap="round" opacity="0.85" />

      {/* Case spine board (vertical) */}
      <rect x={spineStripX} y={spineTop} width={t} height={spineH}
        fill="url(#hatch2)" stroke="var(--c-spine)" strokeWidth="1.8" vectorEffect="non-scaling-stroke" rx="1" />

      {/* Cover boards (front/top + back/bottom), broken at fore edge */}
      {[topBoardY, botBoardY].map((by, i) => (
        <rect key={i} x={jointX} y={by} width={breakX - jointX} height={t}
          fill="var(--c-board)" fillOpacity="0.16"
          stroke="var(--c-board)" strokeWidth="1.8" vectorEffect="non-scaling-stroke" rx="0.8" />
      ))}

      {/* Page block */}
      <rect x={jointX} y={-half} width={breakX - jointX} height={blk}
        fill="var(--c-page)" fillOpacity="0.13"
        stroke="var(--c-page)" strokeWidth="1.2" vectorEffect="non-scaling-stroke" strokeDasharray="3 3" />
      {/* Torn edge overlay to read as "continues" */}
      <path d={jag(0)} fill="none" stroke="var(--c-page)" strokeWidth="1.2" vectorEffect="non-scaling-stroke" opacity="0.7" />

      {/* --- Dimensions --- */}
      {/* Spine height (s) at far left */}
      <Dim cls="dim-spine" fs={fs}
        x1={-30} y1={spineTop} x2={-30} y2={spineTop + spineH}
        label="s" lx={-30 - fs * 0.9} ly={0} rotate={-90} />

      {/* Gutter (g) */}
      <Dim cls="dim-spine" fs={fs}
        x1={t} y1={spineTop - 16} x2={jointX} y2={spineTop - 16}
        label="g" lx={t + g / 2} ly={spineTop - 16} dyLabel={-fs * 0.5} />

      {/* Board thickness (t) on top board */}
      <Dim cls="dim-board" fs={fs * 0.92} plain
        x1={jointX + (breakX - jointX) * 0.62} y1={topBoardY} x2={jointX + (breakX - jointX) * 0.62} y2={topBoardY + t}
        label="board t" lx={jointX + (breakX - jointX) * 0.62} ly={topBoardY - fs * 0.5} />

      {/* Block thickness */}
      <Dim cls="dim-page" fs={fs}
        x1={jointX + (breakX - jointX) * 0.3} y1={-half} x2={jointX + (breakX - jointX) * 0.3} y2={half}
        label="block" lx={jointX + (breakX - jointX) * 0.3} ly={0} rotate={-90} dyLabel={-fs * 0.5} />
    </svg>
  );
}

// ---------- Formatting ----------
function fmt(mm, unit) {
  if (!Number.isFinite(mm)) return '—';
  return unit === 'mm' ? round(mm, 1).toFixed(1) : round(mm / MM_PER_IN, 2).toFixed(2);
}

// ---------- App ----------
function App() {
  const [unit, setUnit] = useState('mm');
  // Values held in the CURRENTLY displayed unit.
  const [vals, setVals] = useState(DEFAULTS_MM);

  const toMm = (v) => (unit === 'mm' ? v : v * MM_PER_IN);

  const onChange = (id, raw) => {
    const n = raw === '' ? NaN : parseFloat(raw);
    setVals((p) => ({ ...p, [id]: n }));
  };

  const switchUnit = (next) => {
    if (next === unit) return;
    const factor = next === 'in' ? 1 / MM_PER_IN : MM_PER_IN;
    const dp = next === 'in' ? 3 : 1;
    setVals((p) => {
      const out = {};
      for (const k in p) out[k] = Number.isFinite(p[k]) ? round(p[k] * factor, dp) : p[k];
      return out;
    });
    setUnit(next);
  };

  // Compute everything in mm.
  const pageW = toMm(vals.pageWidth) || 0;
  const pageH = toMm(vals.pageHeight) || 0;
  const blockT = toMm(vals.blockThickness) || 0;
  const boardT = toMm(vals.boardThickness) || 0;
  const coverMargin = toMm(vals.coverMargin) || 0;
  const fabricMargin = toMm(vals.fabricMargin) || 0;

  const boardW = pageW - 0.5 * blockT + coverMargin;
  const boardH = pageH + 2 * coverMargin;
  const spineW = blockT + 2 * boardT;
  const gutter = blockT / 2 + boardT;
  const fabricW = 2 * boardW + spineW + 2 * gutter + 2 * fabricMargin;
  const fabricH = boardH + 2 * fabricMargin;

  const d = { pageW, pageH, blockT, boardT, coverMargin, fabricMargin,
    boardW, boardH, spineW, gutter, fabricW, fabricH, unit };

  const results = [
    { k: 'Cover board', v: `${fmt(boardW, unit)} × ${fmt(boardH, unit)}`, c: '--c-board' },
    { k: 'Spine board (s)', v: fmt(spineW, unit), c: '--c-spine' },
    { k: 'Hinge gutter (g)', v: fmt(gutter, unit), c: '--c-spine' },
  ];

  return (
    <div className="min-h-screen px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <div className="max-w-[1240px] mx-auto">

        {/* Header */}
        <header className="rise flex flex-wrap items-end justify-between gap-5 mb-6" style={{ animationDelay: '0ms' }}>
          <div>
            <div className="eyebrow mb-2">Bookbinding · Cutting Plan</div>
            <h1 className="font-display font-semibold leading-[0.95] tracking-[-0.03em] text-[clamp(2.1rem,5vw,3.4rem)]"
                style={{ color: 'var(--ink)' }}>
              Coverboard&nbsp;Calculator
            </h1>
            <p className="mt-2 max-w-xl text-[15px]" style={{ color: 'var(--ink-soft)' }}>
              Enter your page block and materials — see the cover boards, spine, and cloth
              laid out to scale, ready to measure and cut.
            </p>
          </div>
          <div className="seg" role="group" aria-label="Units">
            {['mm', 'in'].map((u) => (
              <button key={u} className={u === unit ? 'on' : ''} aria-pressed={u === unit}
                onClick={() => switchUnit(u)}>{u}</button>
            ))}
          </div>
        </header>

        {/* Diagrams */}
        <div className="grid grid-cols-1 lg:grid-cols-5 gap-4 sm:gap-5 mb-4 sm:mb-5">
          <section className="rise card-float lg:col-span-3 p-4 sm:p-5 flex flex-col" style={{ animationDelay: '80ms' }}>
            <div className="flex items-center justify-between mb-3">
              <span className="card-title">Flat Layout · live</span>
              <span className="font-mono text-[11px]" style={{ color: 'var(--ink-faint)' }}>outer face, unfolded</span>
            </div>
            <div className="cutmat flex-1 p-3 min-h-[280px] sm:min-h-[340px]">
              <FlatLayoutSVG d={d} />
            </div>
          </section>

          <section className="rise card-float lg:col-span-2 p-4 sm:p-5 flex flex-col" style={{ animationDelay: '150ms' }}>
            <div className="flex items-center justify-between mb-3">
              <span className="card-title">Cross-Section · live</span>
              <span className="font-mono text-[11px]" style={{ color: 'var(--ink-faint)' }}>spine detail</span>
            </div>
            <div className="cutmat flex-1 p-3 min-h-[220px] sm:min-h-[340px]">
              <CrossSectionSVG d={d} />
            </div>
          </section>
        </div>

        {/* Controls + results */}
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 sm:gap-5">
          <section className="rise card p-5" style={{ animationDelay: '210ms' }}>
            <div className="card-title mb-4">Page Block</div>
            <div className="space-y-3.5">
              <InputField id="pageWidth" label="Width" value={vals.pageWidth} unit={unit} colorVar="--c-page" onChange={onChange} />
              <InputField id="pageHeight" label="Height" value={vals.pageHeight} unit={unit} colorVar="--c-page" onChange={onChange} />
              <InputField id="blockThickness" label="Spine thickness" value={vals.blockThickness} unit={unit} colorVar="--c-page" onChange={onChange} />
            </div>
          </section>

          <section className="rise card p-5" style={{ animationDelay: '270ms' }}>
            <div className="card-title mb-4">Materials</div>
            <div className="space-y-3.5">
              <InputField id="boardThickness" label="Board thickness" value={vals.boardThickness} unit={unit} colorVar="--c-board" onChange={onChange} />
              <InputField id="coverMargin" label="Cover square" value={vals.coverMargin} unit={unit} colorVar="--c-fabric" onChange={onChange} />
              <InputField id="fabricMargin" label="Fabric turn-in" value={vals.fabricMargin} unit={unit} colorVar="--c-fabric" onChange={onChange} />
            </div>
          </section>

          <section className="rise card p-5" style={{ animationDelay: '330ms' }}>
            <div className="card-title mb-4">Cut List</div>
            <div>
              {results.map((r) => (
                <div className="res-row" key={r.k}>
                  <span className="res-key"><span className="swatch" style={{ background: `var(${r.c})` }} />{r.k}</span>
                  <span className="res-val">{r.v} <span style={{ color: 'var(--ink-faint)', fontWeight: 400 }}>{unit}</span></span>
                </div>
              ))}
              <div className="res-row res-total">
                <span className="res-key"><span className="swatch" style={{ background: 'var(--c-fabric)' }} />Total cloth</span>
                <span className="res-val">{fmt(fabricW, unit)} × {fmt(fabricH, unit)} <span style={{ color: 'var(--ink-faint)', fontWeight: 400 }}>{unit}</span></span>
              </div>
            </div>
          </section>

          <section className="rise card p-5" style={{ animationDelay: '390ms' }}>
            <div className="card-title mb-4">Formulas</div>
            <div className="formula">
              <div><b>board&nbsp;w</b> = page&nbsp;w − ½·spine + square</div>
              <div><b>board&nbsp;h</b> = page&nbsp;h + 2·square</div>
              <div><b>spine</b> = spine + 2·board</div>
              <div><b>gutter</b> = spine⁄2 + board</div>
              <div><b>cloth&nbsp;w</b> = 2·board&nbsp;w + spine + 2·gutter + 2·turn-in</div>
              <div><b>cloth&nbsp;h</b> = board&nbsp;h + 2·turn-in</div>
            </div>
          </section>
        </div>

        <footer className="mt-7 text-center font-mono text-[11px]" style={{ color: 'var(--ink-faint)' }}>
          Layflat hardcover model · all dimensions live · measure twice, cut once
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
